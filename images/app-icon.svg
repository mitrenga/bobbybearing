<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
<title id="title">Bobby Bearing — stříbrná neonová koule</title>
<desc id="desc">Usměvavá stříbrná koule s tyrkysovými neonovými obrysy. Na žlutooranžovém pozadí, kresba nejméně 112 pixelů od okrajů.</desc>
<defs>
 <radialGradient id="silver" cx="34%" cy="24%" r="77%"><stop stop-color="#ffffff"/><stop offset=".23" stop-color="#e9edf1"/><stop offset=".48" stop-color="#b9c1ca"/><stop offset=".68" stop-color="#f0f3f6"/><stop offset=".87" stop-color="#87929f"/><stop offset="1" stop-color="#d6dce3"/></radialGradient>
 <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#26efff"/><stop offset=".35" stop-color="#ffffff"/><stop offset=".6" stop-color="#ff51ed"/><stop offset="1" stop-color="#ffe85e"/></linearGradient>
 <radialGradient id="ink"><stop stop-color="#14283e"/><stop offset="1" stop-color="#020815"/></radialGradient>
 <radialGradient id="shine"><stop stop-color="white" stop-opacity=".95"/><stop offset="1" stop-color="white" stop-opacity="0"/></radialGradient>
 <filter id="glow" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="9"/></filter>
 <clipPath id="safe"><rect x="112" y="112" width="800" height="800"/></clipPath>
</defs>
<!-- The yellow and orange of the poster's tiles, over the whole canvas. -->
<radialGradient id="bg" cx="50%" cy="45%" r="75%"><stop stop-color="#ffd23a"/><stop offset="1" stop-color="#ff8a00"/></radialGradient>
<rect width="1024" height="1024" fill="url(#bg)"/>
<!-- All artwork including glow is confined to a 800px square, leaving 10.9375% margins of background only. -->
<g clip-path="url(#safe)">
 <circle cx="512" cy="512" r="366" fill="none" stroke="#20eaff" stroke-width="18" opacity=".75" filter="url(#glow)"/>
 <circle cx="512" cy="512" r="366" fill="url(#silver)" stroke="#08243b" stroke-width="8"/>
 <circle cx="512" cy="512" r="358" fill="none" stroke="url(#rim)" stroke-width="10"/>
 <path d="M 207 470 A 310 310 0 0 1 437 208" fill="none" stroke="white" stroke-width="13" stroke-linecap="round" opacity=".8"/>
 <ellipse cx="389" cy="302" rx="157" ry="79" fill="url(#shine)" transform="rotate(-32 389 302)"/>
 <path d="M 269 707 Q 473 909 749 717" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="round" opacity=".6"/>
 <g fill="none" stroke="#00e7ff" stroke-width="24" filter="url(#glow)">
  <ellipse cx="444" cy="465" rx="78" ry="118"/><ellipse cx="647" cy="448" rx="72" ry="111"/>
  <path d="M 385 628 Q 529 709 710 601 Q 675 786 531 773 Q 422 761 385 628 Z"/>
 </g>
 <g fill="url(#ink)" stroke="#1ceaff" stroke-width="16">
  <ellipse cx="444" cy="465" rx="78" ry="118"/><ellipse cx="647" cy="448" rx="72" ry="111"/>
  <path d="M 385 628 Q 529 709 710 601 Q 675 786 531 773 Q 422 761 385 628 Z" stroke-linejoin="round"/>
 </g>
 <g fill="none" stroke="#efffff" stroke-width="7">
  <ellipse cx="444" cy="465" rx="78" ry="118"/><ellipse cx="647" cy="448" rx="72" ry="111"/>
  <path d="M 385 628 Q 529 709 710 601 Q 675 786 531 773 Q 422 761 385 628 Z" stroke-linejoin="round"/>
 </g>
 <g fill="white"><ellipse cx="464" cy="431" rx="24" ry="42" transform="rotate(-13 464 431)"/><ellipse cx="663" cy="416" rx="22" ry="39" transform="rotate(-13 663 416)"/></g>
</g>
</svg>
